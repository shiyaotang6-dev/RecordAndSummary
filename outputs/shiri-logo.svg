      <stop offset=".52" stop-color="#152630" stop-opacity=".98"/>
      <stop offset="1" stop-color="#0b151d"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="176" y1="128" x2="836" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9f6f1" stop-opacity=".92"/>
