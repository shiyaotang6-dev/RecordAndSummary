<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <link rel="icon" type="image/png" href="shiri-logo.png">
  <title>总结记录</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202824;
      --muted: #79837e;
      --line: #e7ebe6;
      --paper: #ffffff;
      --canvas: #f4f6f2;
      --green: #236b52;
      --green-dark: #174d3b;
      --green-soft: #e8f2ec;
      --yellow: #f0c86a;
      --coral: #d87e64;
      --blue: #6f91a4;
      --shadow: 0 8px 28px rgba(30, 52, 40, .045);
      font-family: Inter, "Segoe UI", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 14px; }
    button, input, textarea, select { color: inherit; font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
    .sidebar { background: var(--paper); border-right: 1px solid var(--line); padding: 25px 15px 17px; display: flex; flex-direction: column; min-height: 100vh; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; margin-bottom: 27px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: var(--green); }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font-size: 17px; font-weight: 750; letter-spacing: 0; }
    .brand-caption { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
    .new-entry { height: 42px; width: 100%; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 9px; background: var(--green); color: white; font-weight: 650; box-shadow: 0 3px 8px rgba(35,107,82,.15); }
    .new-entry:hover, .save-entry:hover { background: var(--green-dark); }
    .new-entry svg { width: 17px; height: 17px; }
    .side-label { margin: 27px 11px 9px; text-transform: uppercase; color: #a0a8a3; font-size: 10px; letter-spacing: 1px; font-weight: 700; }
    .nav { display: grid; gap: 4px; }
    .nav-item { height: 40px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; display: flex; align-items: center; gap: 12px; color: #58635d; text-align: left; }
    .nav-item svg { width: 17px; height: 17px; color: #7c8881; flex: none; }
    .nav-item.active { color: var(--green-dark); background: var(--green-soft); font-weight: 650; }
    .nav-item.active svg { color: var(--green); }
    .side-date { margin: 11px 11px 0; color: var(--muted); font-size: 12px; }
    .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--line); padding: 15px 7px 0; }
    .local-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .local-dot { width: 7px; height: 7px; background: #64a783; border-radius: 50%; }
    .profile { display: flex; align-items: center; gap: 9px; margin-top: 17px; }
    .avatar { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; color: #664d2a; background: #f2e4c5; font-weight: 700; }
    .profile-name { font-size: 12px; font-weight: 650; }
    .profile-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .main { min-width: 0; padding: 0 35px 54px; }
    .topbar { height: 67px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); margin: 0 -2px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .breadcrumb strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 11px; }
    .search-wrap { width: 208px; height: 34px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 7px; background: white; padding: 0 9px; }
    .search-wrap svg { width: 15px; height: 15px; color: #8a948e; flex: none; }
    .search-wrap input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; font-size: 12px; }
    .search-wrap input::placeholder { color: #a1aaa5; }
    .icon-button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 7px; background: white; display: grid; place-items: center; }
    .icon-button svg { width: 16px; height: 16px; color: #66736c; }
    .workspace { max-width: 1180px; margin: 0 auto; }
    .page-head { padding: 31px 0 21px; display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .4px; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.25; font-weight: 720; letter-spacing: 0; }
    .date-subtitle { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .date-tools { display: flex; align-items: center; gap: 8px; flex: none; }
    .date-arrow { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 7px; background: white; display: grid; place-items: center; }
    .date-arrow svg { width: 15px; height: 15px; color: #64716a; }
    .today-button { height: 32px; border: 1px solid var(--line); border-radius: 7px; background: white; padding: 0 11px; color: #56625b; font-size: 12px; }
    .view-tabs { display: inline-flex; gap: 3px; padding: 3px; background: #e9ede8; border-radius: 8px; margin-bottom: 21px; }
    .view-tab { min-width: 68px; height: 30px; border: 0; border-radius: 6px; padding: 0 12px; color: #6e7972; background: transparent; font-size: 12px; }
    .view-tab.active { background: white; color: var(--green-dark); font-weight: 650; box-shadow: 0 1px 3px rgba(25,46,35,.08); }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
    .primary-column, .insight-column { min-width: 0; }
    .primary-column { display: flex; flex-direction: column; }
    .primary-column .composer { order: 2; }
    .primary-column .list-head, .primary-column .filter-row, .primary-column .entry-list { order: 1; }
    .composer { background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 17px; box-shadow: var(--shadow); }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .section-title h2 { margin: 0; font-size: 14px; font-weight: 700; }
    .section-hint { color: var(--muted); font-size: 11px; }
    .entry-input { width: 100%; min-height: 79px; resize: vertical; border: 1px solid #e6ebe6; border-radius: 7px; background: #fbfcfa; padding: 12px; outline: 0; line-height: 1.65; }
    .entry-input:focus, .summary-input:focus { border-color: #8ab49e; box-shadow: 0 0 0 3px rgba(35,107,82,.08); }
    .entry-input::placeholder { color: #a1aaa4; }
    .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; }
    .entry-options { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .select-control, .duration-control { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: white; padding: 0 9px; color: #68746d; font-size: 11px; }
    .select-control { min-width: 93px; }
    .duration-control { width: 88px; }
    .save-entry { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; border: 0; border-radius: 6px; background: var(--green); color: white; padding: 0 13px; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .save-entry svg { width: 14px; height: 14px; }
    .list-head { margin: 24px 0 11px; display: flex; align-items: center; justify-content: space-between; }
    .list-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
    .entry-count { color: var(--muted); font-size: 11px; }
    .filter-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 0 0 11px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip { flex: none; height: 26px; border: 1px solid #e5eae5; background: white; color: #768078; padding: 0 10px; border-radius: 20px; font-size: 11px; }
    .filter-chip.active { color: var(--green-dark); border-color: #b8d1c1; background: #edf5ef; }
    .entry-list { display: grid; gap: 9px; }
    .entry-card { position: relative; display: grid; grid-template-columns: 54px minmax(0,1fr) 28px; gap: 12px; align-items: start; background: white; border: 1px solid var(--line); border-radius: 8px; padding: 14px 13px; }
    .entry-time { padding-top: 2px; color: #87928b; font-size: 11px; font-variant-numeric: tabular-nums; }
    .entry-body { min-width: 0; }
    .entry-title { font-size: 13px; line-height: 1.55; font-weight: 640; word-break: break-word; }
    .entry-detail { color: #758078; font-size: 12px; line-height: 1.65; margin-top: 5px; white-space: pre-wrap; word-break: break-word; }
    .entry-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }
    .tag { display: inline-flex; align-items: center; height: 21px; border-radius: 5px; padding: 0 7px; color: #4c765e; background: #eaf3ec; font-size: 10px; }
    .tag.tag-学习 { color: #657fa0; background: #edf1f8; }
    .tag.tag-生活 { color: #aa7450; background: #fbf0e5; }
    .tag.tag-灵感 { color: #a36358; background: #faece8; }
    .tag.tag-健康 { color: #6d8a4d; background: #f0f4e6; }
    .entry-project, .entry-duration { color: #939c96; font-size: 10px; }
    .entry-project::before { content: "·"; margin-right: 6px; color: #c1c8c2; }
    .delete-entry { width: 27px; height: 27px; border: 0; border-radius: 5px; background: transparent; display: grid; place-items: center; opacity: .45; }
    .delete-entry:hover { opacity: 1; background: #f8efed; color: #b45a4b; }
    .delete-entry svg { width: 14px; height: 14px; }
    .empty-state { background: white; border: 1px dashed #dce3dc; border-radius: 8px; text-align: center; color: var(--muted); padding: 34px 20px; font-size: 12px; }
    .empty-symbol { width: 35px; height: 35px; border-radius: 50%; display: grid; place-items: center; background: #eff4ef; color: var(--green); margin: 0 auto 10px; font-size: 18px; }
    .side-panel { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 16px; box-shadow: var(--shadow); }
    .side-panel + .side-panel { margin-top: 12px; }
    .side-panel h2 { margin: 0; font-size: 13px; font-weight: 700; }
    .today-stat { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 15px 0 14px; }
    .stat-box { min-height: 65px; border-radius: 7px; background: #f6f8f5; padding: 10px; }
    .stat-value { font-size: 20px; line-height: 1; font-weight: 730; color: var(--green-dark); font-variant-numeric: tabular-nums; }
    .stat-label { margin-top: 7px; color: #859089; font-size: 10px; }
    .progress-track { height: 5px; border-radius: 9px; background: #e9eee9; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--green); transition: width .2s ease; }
    .progress-note { display: flex; justify-content: space-between; gap: 8px; color: #8a948e; font-size: 10px; margin-top: 7px; }
    .week-mini { margin-top: 15px; display: grid; gap: 9px; }
    .week-row { display: grid; grid-template-columns: 22px 1fr 23px; align-items: center; gap: 8px; color: #7a857e; font-size: 10px; }
    .week-track { height: 5px; border-radius: 8px; background: #edf0ec; overflow: hidden; }
    .week-fill { height: 100%; background: #84b59a; border-radius: inherit; }
    .week-total { text-align: right; font-variant-numeric: tabular-nums; }
    .quote-panel { background: #f7f3e8; border-color: #eee6d5; }
    .quote-mark { color: #c29742; font-size: 22px; line-height: .6; margin-top: 14px; }
    .quote-text { margin-top: 7px; color: #615a4b; font-size: 12px; line-height: 1.7; }
    .quote-source { color: #a69b84; font-size: 10px; margin-top: 8px; }
    .period-layout { display: grid; grid-template-columns: minmax(0,1fr) 295px; gap: 20px; align-items: start; }
    .period-main { min-width: 0; }
    .period-banner { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 18px 20px; border-radius: 9px; background: var(--green); color: white; margin-bottom: 14px; }
    .period-banner h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .period-banner p { margin: 6px 0 0; color: rgba(255,255,255,.72); font-size: 11px; }
    .banner-count { text-align: right; flex: none; }
    .banner-count strong { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .banner-count span { color: rgba(255,255,255,.7); font-size: 10px; }
    .metric-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-bottom: 14px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 13px 14px; }
    .metric-value { font-size: 20px; font-weight: 730; line-height: 1.1; }
    .metric-label { color: var(--muted); font-size: 10px; margin-top: 7px; }
    .period-panel { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 17px; margin-bottom: 12px; }
    .period-panel .section-title { margin-bottom: 14px; }
    .day-bars { display: grid; gap: 11px; }
    .day-bar-row { display: grid; grid-template-columns: 49px minmax(0,1fr) 24px; gap: 9px; align-items: center; }
    .day-name { color: #748078; font-size: 10px; }
    .day-bar-track { height: 7px; border-radius: 10px; background: #eef1ed; overflow: hidden; }
    .day-bar-fill { height: 100%; border-radius: inherit; background: #77a98d; min-width: 0; }
    .day-bar-count { text-align: right; color: #8e9891; font-size: 10px; }
    .review-label { display: block; color: #58655c; font-size: 11px; font-weight: 650; margin: 13px 0 7px; }
    .summary-input { display: block; width: 100%; min-height: 88px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: #fcfdfb; outline: 0; line-height: 1.65; font-size: 12px; }
    .summary-save { height: 30px; padding: 0 10px; margin-top: 9px; color: var(--green-dark); background: var(--green-soft); border: 1px solid #d9e9dd; border-radius: 6px; font-size: 11px; font-weight: 650; }
    .summary-status { display: inline-block; margin-left: 8px; color: #849087; font-size: 10px; }
    .tag-summary { display: grid; gap: 10px; }
    .tag-summary-row { display: grid; grid-template-columns: 68px 1fr 20px; align-items: center; gap: 8px; }
    .tag-summary-row .tag { width: max-content; }
    .tag-summary-track { height: 5px; background: #eff2ee; overflow: hidden; border-radius: 9px; }
    .tag-summary-fill { height: 100%; border-radius: inherit; background: var(--green); }
    .tag-summary-count { text-align: right; color: #8a948d; font-size: 10px; }
    .calendar { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 5px; }
    .calendar-head { height: 25px; display: grid; place-items: center; color: #8a948e; font-size: 10px; }
    .calendar-day { min-height: 64px; border: 1px solid #edf0ec; border-radius: 6px; background: white; padding: 7px; text-align: left; position: relative; }
    .calendar-day:hover { border-color: #a9c8b4; background: #fbfdfb; }
    .calendar-day.outside { color: #b9c0ba; background: #fafbf9; }
    .calendar-day.today { border-color: #76a98b; box-shadow: inset 0 0 0 1px #76a98b; }
    .calendar-num { font-size: 10px; }
    .calendar-dots { display: flex; gap: 3px; margin-top: 10px; }
    .calendar-dot { width: 5px; height: 5px; border-radius: 50%; background: #77a98d; }
    .calendar-count { color: #8a948e; font-size: 9px; margin-top: 4px; }
    .calendar-page .calendar { gap: 6px; }
    .calendar-page .calendar-head { height: 27px; }
    .calendar-page .calendar-day { min-height: 80px; border-radius: 7px; padding: 10px; }
    .calendar-day.selected { border-color: #78ab8d; box-shadow: inset 0 0 0 1px #78ab8d; }
    .calendar-day.today .calendar-num { color: var(--green-dark); font-weight: 750; }
    .calendar-help { color: #859089; font-size: 11px; }
    .day-back { height: 32px; border: 1px solid var(--line); border-radius: 7px; background: white; padding: 0 10px; color: #56625b; font-size: 11px; }
    .mini-records { display: grid; gap: 8px; }
    .mini-record { border-left: 2px solid #8db79b; padding: 2px 0 2px 10px; }
    .mini-record-title { font-size: 11px; line-height: 1.5; }
    .mini-record-meta { color: #89948c; font-size: 9px; margin-top: 4px; }
    .period-history { display: flex; align-items: center; gap: 10px; margin: 0 0 13px; }
    .period-history label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .period-history select { min-width: min(100%, 300px); height: 34px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 7px; color: inherit; background: rgba(10, 15, 22, .56); }
    .metric-button { width: 100%; color: inherit; text-align: left; cursor: pointer; }
    .metric-button:hover, .metric-button.active { border-color: rgba(205, 224, 248, .48); box-shadow: 0 0 16px rgba(157, 190, 236, .17), inset 0 1px rgba(255,255,255,.2); }
    .metric-button:focus-visible, .auto-summary-item:focus-visible, .recent-entry:focus-visible, .metric-detail-row:focus-visible { outline: 2px solid #b8cce7; outline-offset: 2px; }
    .metric-details[hidden] { display: none; }
    .metric-detail-list { display: grid; gap: 7px; }
    .metric-detail-row { width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 12px; padding: 10px 11px; color: inherit; text-align: left; border: 1px solid rgba(205,218,235,.12); border-radius: 7px; background: rgba(7, 12, 20, .25); cursor: pointer; }
    .metric-detail-row:hover, .recent-entry:hover, .auto-summary-item:hover { border-color: rgba(205,224,248,.34); background-color: rgba(151,177,213,.1); }
    .metric-detail-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .metric-detail-meta { color: var(--muted); font-size: 10px; }
    .period-history-wrap { min-width: 0; }
    .period-history-wrap select { max-width: 100%; }
    .auto-summary-item { width: 100%; padding: 4px 6px; color: inherit; text-align: left; border: 1px solid transparent; border-radius: 5px; background: transparent; cursor: pointer; }
    .auto-summary-item { display: grid; grid-template-columns: minmax(116px, 138px) minmax(0, 1fr); align-items: start; gap: 0 7px; }
    .auto-summary-item.date-mode { grid-template-columns: minmax(0, 1fr); }
    .auto-summary-item.date-mode .auto-summary-date { display: none; }
    .auto-summary-date { color: inherit; font-size: 10px; }
    .auto-summary-content { min-width: 0; overflow-wrap: anywhere; }
    .auto-summary-title, .auto-summary-detail { display: inline; }
    .summary-mode-switch { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid rgba(205,218,235,.16); border-radius: 7px; background: rgba(7, 12, 20, .22); }
    .summary-mode-button { height: 25px; padding: 0 8px; color: var(--muted); border: 0; border-radius: 5px; background: transparent; font-size: 10px; cursor: pointer; }
    .summary-mode-button.active { color: inherit; background: rgba(154,181,218,.2); box-shadow: inset 0 0 0 1px rgba(205,224,248,.18); }
    .time-stats { margin-bottom: 12px; }
    .time-stat-list { display: grid; gap: 7px; }
    .time-stat-group { display: grid; gap: 5px; }
    .time-stat-row { width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 9px; padding: 8px 9px; color: inherit; text-align: left; border: 1px solid rgba(205,218,235,.13); border-radius: 7px; background: rgba(7, 12, 20, .2); cursor: pointer; }
    .time-stat-row:hover { border-color: rgba(205,224,248,.36); background: rgba(151,177,213,.1); }
    .time-stat-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .time-stat-count, .time-stat-total { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .time-stat-details { display: grid; gap: 4px; padding: 0 5px 0 12px; border-left: 1px solid rgba(185,204,228,.22); }
    .time-stat-detail { width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 5px 6px; color: inherit; text-align: left; border: 1px solid transparent; border-radius: 5px; background: transparent; cursor: pointer; }
    .time-stat-detail:hover { border-color: rgba(205,224,248,.28); background: rgba(151,177,213,.1); }
    .time-stat-detail-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .time-stat-detail-time { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .time-stats-empty { color: var(--muted); font-size: 10px; }
    @media (max-width: 760px) { .insight-column .time-stats { grid-column: 1 / -1; } }
    .category-manage { height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; color: inherit; background: rgba(10, 15, 22, .34); font-size: 10px; white-space: nowrap; }
    .category-dialog { width: min(440px, calc(100vw - 28px)); max-height: min(680px, calc(100vh - 32px)); padding: 0; overflow: hidden; color: #e9eef5; border: 1px solid rgba(211,226,246,.3); border-radius: 12px; background: rgba(15,22,32,.97); box-shadow: 0 24px 70px rgba(0,0,0,.5); }
    .category-dialog::backdrop { background: rgba(2, 5, 10, .65); backdrop-filter: blur(5px); }
    .category-dialog-inner { padding: 19px; }
    .category-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .category-dialog-head h2 { margin: 0; font-size: 16px; }
    .category-dialog-close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 7px; color: inherit; background: rgba(255,255,255,.06); }
    .category-add-row { display: flex; gap: 8px; margin-top: 7px; }

    <button data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/><path d="M2 21h21"/></svg><span>周记录</span></button>
    <button data-view="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9h17M8 13h.01M12 13h.01M16 13h.01"/></svg><span>月记录</span></button>

  <dialog class="category-dialog" id="categoryDialog" aria-labelledby="categoryDialogTitle">
    <div class="category-dialog-inner">
      <div class="category-dialog-head"><h2 id="categoryDialogTitle">管理分类</h2><button class="category-dialog-close" id="closeCategoryDialog" type="button" aria-label="关闭">×</button></div>
      <label class="entry-field-label" for="newCategoryInput">添加自定义分类</label>
      <div class="category-add-row"><input id="newCategoryInput" type="text" maxlength="20" placeholder="输入分类名称"><button id="addCategoryButton" type="button">添加</button></div>
      <div class="category-list" id="categoryManagerList"></div>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const STORAGE_KEY = 'shiri-journal-v1';
      const builtInCategories = ['工作', '学习', '生活', '灵感', '健康'];
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dateKey = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };
      const shiftDate = (date, amount) => { const next = new Date(date); next.setDate(next.getDate() + amount); return next; };
      const parseDate = (key) => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); };
      const weekday = (date) => ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()];
      const fullDate = (date) => `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${weekday(date)}`;
      const formatDuration = (minutes) => {
        const total = Math.max(0, Number(minutes) || 0);
        return `${Math.floor(total / 60)}时${String(total % 60).padStart(2, '0')}分`;
      };
      const startOfWeek = (date) => { const copy = new Date(date); copy.setDate(copy.getDate() - ((copy.getDay() + 6) % 7)); copy.setHours(0, 0, 0, 0); return copy; };
      const sampleDate = (offset) => dateKey(shiftDate(today, offset));
      const seed = [
        { id: 'sample-1', date: sampleDate(-4), time: '09:20', title: '整理本周的项目目标和优先级', detail: '把几个关键节点拆成可以逐步推进的小块。', tag: '工作', project: '季度计划', duration: 35 },
        { id: 'sample-2', date: sampleDate(-3), time: '14:10', title: '读完产品设计章节，记下三个想法', detail: '关于减少输入步骤的部分很有启发。', tag: '学习', project: '阅读', duration: 50 },
        { id: 'sample-3', date: sampleDate(-2), time: '11:30', title: '完成数据看板的第一版', detail: '确认核心指标口径，并和同事对齐展示顺序。', tag: '工作', project: '数据看板', duration: 90 },
        { id: 'sample-4', date: sampleDate(-1), time: '18:40', title: '散步半小时，顺手买了晚餐食材', detail: '', tag: '生活', project: '', duration: 30 },
        { id: 'sample-5', date: sampleDate(0), time: '09:15', title: '梳理本周重点，确定今天先完成的两件事', detail: '把需要集中精力的工作安排在上午。', tag: '工作', project: '每日计划', duration: 20 },
        { id: 'sample-6', date: sampleDate(0), time: '11:05', title: '完成方案初稿并发给团队收集意见', detail: '先把结构和关键结论写清楚，细节留到下一轮完善。', tag: '工作', project: '产品方案', duration: 80 },
        { id: 'sample-7', date: sampleDate(0), time: '13:30', title: '记下一个新想法：给每周回顾加上主题', detail: '回顾不只统计做了多少，也能看出这一周围绕什么展开。', tag: '灵感', project: '', duration: 10 }
      ];
      let state;
      try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { state = null; }
      if (!state || !Array.isArray(state.entries)) state = { entries: seed, notes: {} };
      state.notes ||= {};
      state.categories = Array.isArray(state.categories) ? state.categories.filter((category) => typeof category === 'string' && category.trim()) : [];
      let categories = [...new Set([...builtInCategories, ...state.categories, ...state.entries.map((entry) => String(entry.tag || '').trim()).filter(Boolean)])];
      state.categories = categories.filter((category) => !builtInCategories.includes(category));
      let selectedDate = new Date(today);
      let view = 'calendar';
      let activeTag = '全部';
      let searchTerm = '';
      let editingEntryId = '';
      const root = document.getElementById('viewRoot');
      const toast = document.getElementById('toast');
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const persist = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const entriesFor = (key) => state.entries.filter((entry) => entry.date === key).sort((a, b) => a.time.localeCompare(b.time));
      const rangeEntries = (start, end) => state.entries.filter((entry) => entry.date >= dateKey(start) && entry.date <= dateKey(end));
      const periodKey = () => view === 'week' ? `week-${dateKey(startOfWeek(selectedDate))}` : `month-${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}`;
      const periodDate = (date) => `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      const monthKeyFor = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      const weekOwnerMonth = (start) => shiftDate(start, 3);
      const availableWeeks = () => {
        const keys = new Set([dateKey(startOfWeek(today)), dateKey(startOfWeek(selectedDate))]);
        state.entries.forEach((entry) => keys.add(dateKey(startOfWeek(parseDate(entry.date)))));
        Object.keys(state.notes).forEach((key) => { const match = key.match(/^week-(\d{4}-\d{2}-\d{2})$/); if (match) keys.add(match[1]); });
        return [...keys].sort((a, b) => b.localeCompare(a)).map((key) => parseDate(key));
      };
      const availableMonths = () => {
        const keys = new Set([monthKeyFor(today), monthKeyFor(selectedDate)]);
        state.entries.forEach((entry) => keys.add(entry.date.slice(0, 7)));
        Object.keys(state.notes).forEach((key) => { const match = key.match(/^month-(\d{4}-\d{2})$/); if (match) keys.add(match[1]); });
        return [...keys].sort((a, b) => b.localeCompare(a));
      };
      const showToast = (message) => {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
      };
      const syncCategories = () => {
        categories = [...new Set([...builtInCategories, ...state.categories, ...state.entries.map((entry) => String(entry.tag || '').trim()).filter(Boolean)])];
        state.categories = categories.filter((category) => !builtInCategories.includes(category));
      };
      const renderCategoryManager = () => {
        const list = document.getElementById('categoryManagerList');
        if (!list) return;
        list.innerHTML = categories.map((category) => {
          const builtIn = builtInCategories.includes(category);
          const usage = state.entries.filter((entry) => entry.tag === category).length;
          const locked = builtIn || usage > 0;
          return `<div class="category-row"><span>${escapeHtml(category)}${builtIn ? '<small>默认</small>' : usage ? `<small>${usage} 条记录正在使用</small>` : '<small>自定义</small>'}</span><button class="category-delete" type="button" data-remove-category="${escapeHtml(category)}" ${locked ? 'disabled title="默认分类或已使用分类不能删除"' : 'title="删除分类"'}>删除</button></div>`;
        }).join('');
        list.querySelectorAll('[data-remove-category]').forEach((button) => button.addEventListener('click', () => {
          const category = button.dataset.removeCategory;
          state.categories = state.categories.filter((item) => item !== category);
          syncCategories();
          persist();
          renderCategoryManager();
          render();
        }));
      };
      const openCategoryManager = () => {
        renderCategoryManager();
        document.getElementById('categoryDialog').showModal();
        document.getElementById('newCategoryInput').focus();
      };
      const addCategory = () => {
        const input = document.getElementById('newCategoryInput');
        const category = input.value.trim();
        if (!category) { input.focus(); return; }
        if (categories.includes(category)) { showToast('这个分类已经存在'); input.select(); return; }
        state.categories.push(category);
        syncCategories();
        persist();
        input.value = '';
        renderCategoryManager();
        render();
        input.focus();
        showToast('已添加自定义分类');
      };
      const renderRecentEntries = () => {
        const list = document.getElementById('recentEntries');
        if (!list) return;
        const scrollTop = list.scrollTop;
        const recent = state.entries.slice().sort((a, b) => b.date.localeCompare(a.date) || String(b.time || '').localeCompare(String(a.time || ''))).slice(0, 100);

        const gridStart = shiftDate(first, -offset);
        const days = Array.from({ length: 42 }, (_, index) => shiftDate(gridStart, index));
        root.innerHTML = `<div class="calendar-page"><div class="section-title"><h2>日记录</h2><span class="calendar-help">有圆点表示当天有记录</span></div><div class="calendar">${['一','二','三','四','五','六','日'].map((day) => `<div class="calendar-head">${day}</div>`).join('')}${days.map((day) => { const key = dateKey(day); const count = entriesFor(key).length; const outside = day.getMonth() !== month; return `<button class="calendar-day ${outside ? 'outside' : ''} ${key === dateKey(today) ? 'today' : ''} ${key === dateKey(selectedDate) ? 'selected' : ''}" data-date="${key}" aria-label="${day.getFullYear()}年${day.getMonth()+1}月${day.getDate()}日，${count} 条记录"><span class="calendar-num">${day.getDate()}</span>${count ? `<div class="calendar-dots"><span class="calendar-dot"></span>${count > 1 ? '<span class="calendar-dot"></span>' : ''}${count > 2 ? '<span class="calendar-dot"></span>' : ''}</div><div class="calendar-count">${count} 条</div>` : ''}</button>`; }).join('')}</div></div>`;
        root.querySelectorAll('[data-date]').forEach((button) => button.addEventListener('click', () => { selectedDate = parseDate(button.dataset.date); view = 'day'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
      };
      const renderWeek = () => {
        const start = startOfWeek(selectedDate); const end = shiftDate(start, 6); const entries = rangeEntries(start, end);
        const days = Array.from({ length: 7 }, (_, i) => shiftDate(start, i));
        const activeDays = days.filter((day) => entriesFor(dateKey(day)).length).length;
        const minutes = entries.reduce((sum, entry) => sum + Number(entry.duration || 0), 0);
        const max = Math.max(1, ...days.map((day) => entriesFor(dateKey(day)).length));
        const key = `week-${dateKey(start)}`; const savedNote = state.notes[key] || '';
        const owner = weekOwnerMonth(start);
        const recent = entries.slice().sort((a, b) => b.date.localeCompare(a.date) || String(b.time || '').localeCompare(String(a.time || ''))).slice(0, 4);
        const summaryPanel = `<section class="period-panel period-summary-top"><div class="section-title"><h2>本周自动汇总</h2><span class="section-hint">根据 ${entries.length} 条日记录整理</span></div>${renderAutoSummaryControls(entries)}<label class="reflection-label" for="summaryInput">补充本周感想</label><textarea class="summary-input" id="summaryInput" placeholder="这一周的收获、挑战，或想带到下周的想法……">${escapeHtml(savedNote)}</textarea><button class="summary-save" id="saveSummary">保存感想</button><span class="summary-status" id="summaryStatus"></span></section>`;
        root.innerHTML = `${renderPeriodHistory('week')}${summaryPanel}<div class="period-layout"><div class="period-main"><section class="period-banner"><div><h2>${periodDate(start)}-${periodDate(end)}</h2><p>隶属于${owner.getFullYear()}年${owner.getMonth() + 1}月 · 本周有 ${entries.length} 件事值得记住</p></div><div class="banner-count"><strong>${activeDays}<span style="font-size:12px;font-weight:500"> / 7</span></strong><span>有记录的天数</span></div></section>${renderMetricCards(entries, activeDays, minutes)}<section class="period-panel"><div class="section-title"><h2>每天的节奏</h2><span class="section-hint">按记录条数</span></div><div class="day-bars">${days.map((day) => { const count = entriesFor(dateKey(day)).length; return `<div class="day-bar-row"><span class="day-name">${weekday(day)} ${day.getMonth() + 1}/${day.getDate()}</span><div class="day-bar-track"><div class="day-bar-fill" style="width:${count ? Math.max(4, Math.round(count / max * 100)) : 0}%"></div></div><span class="day-bar-count">${count || '—'}</span></div>`; }).join('')}</div></section></div><aside class="period-aside"><section class="period-panel"><div class="section-title"><h2>记录分布</h2><span class="section-hint">按分类</span></div>${renderTagSummary(entries)}</section><section class="period-panel"><div class="section-title"><h2>最近几条</h2><span class="section-hint">${Math.min(entries.length, 4)} 条</span></div><div class="mini-records">${recent.map((entry) => `<button type="button" class="mini-record" data-open-entry="${escapeHtml(entry.id)}"><span class="mini-record-title">${escapeHtml(entry.title)}</span><span class="mini-record-meta">${periodDate(parseDate(entry.date))} ${weekday(parseDate(entry.date))} · ${escapeHtml(entry.tag)}</span></button>`).join('') || '<div class="section-hint">记录几件小事，这里就会慢慢丰富起来。</div>'}</div></section></aside></div>`;
        root.querySelector('.period-main').insertAdjacentHTML('beforeend', renderTimeStats(entries, 'week'));
        bindPeriodControls(entries, 'week');
        bindAutoSummaryControls(entries);
        bindTimeStats();
        document.getElementById('saveSummary').addEventListener('click', () => { state.notes[key] = document.getElementById('summaryInput').value.trim(); persist(); document.getElementById('summaryStatus').textContent = '已保存'; renderRecentEntries(); });
      };
      const renderMonth = () => {
        const year = selectedDate.getFullYear(); const month = selectedDate.getMonth();
        const monthEntries = state.entries.filter((entry) => { const d = parseDate(entry.date); return d.getFullYear() === year && d.getMonth() === month; });
        const activeDays = new Set(monthEntries.map((entry) => entry.date)).size;
        const minutes = monthEntries.reduce((sum, entry) => sum + Number(entry.duration || 0), 0);
        const key = `month-${monthKeyFor(selectedDate)}`; const savedNote = state.notes[key] || '';
        const recent = monthEntries.slice().sort((a, b) => b.date.localeCompare(a.date) || String(b.time || '').localeCompare(String(a.time || ''))).slice(0, 5);
        const summaryPanel = `<section class="period-panel period-summary-top"><div class="section-title"><h2>本月自动汇总</h2><span class="section-hint">根据 ${monthEntries.length} 条日记录整理</span></div>${renderAutoSummaryControls(monthEntries)}<label class="reflection-label" for="summaryInput">补充本月感想</label><textarea class="summary-input" id="summaryInput" placeholder="这个月的重要进展、收获，或想带到下个月的想法……">${escapeHtml(savedNote)}</textarea><button class="summary-save" id="saveSummary">保存感想</button><span class="summary-status" id="summaryStatus"></span></section>`;
        root.innerHTML = `${renderPeriodHistory('month')}${summaryPanel}<div class="period-layout"><div class="period-main"><section class="period-banner"><div><h2>${year}年${month + 1}月记录</h2><p>按分类整理日记录，回看本月的进展和收获</p></div><div class="banner-count"><strong>${monthEntries.length}</strong><span>条记录</span></div></section>${renderMetricCards(monthEntries, activeDays, minutes)}</div><aside class="period-aside"><section class="period-panel"><div class="section-title"><h2>记录分布</h2><span class="section-hint">按分类</span></div>${renderTagSummary(monthEntries)}</section><section class="period-panel"><div class="section-title"><h2>本月片段</h2><span class="section-hint">${Math.min(monthEntries.length, 5)} 条</span></div><div class="mini-records">${recent.map((entry) => `<button type="button" class="mini-record" data-open-entry="${escapeHtml(entry.id)}"><span class="mini-record-title">${escapeHtml(entry.title)}</span><span class="mini-record-meta">${periodDate(parseDate(entry.date))} ${weekday(parseDate(entry.date))} · ${escapeHtml(entry.tag)}</span></button>`).join('') || '<div class="section-hint">这段时间还没有留下记录。</div>'}</div></section></aside></div>`;
        root.querySelector('.period-main').insertAdjacentHTML('beforeend', renderTimeStats(monthEntries, 'month'));
        bindPeriodControls(monthEntries, 'month');
        bindAutoSummaryControls(monthEntries);
        bindTimeStats();
        document.getElementById('saveSummary').addEventListener('click', () => { state.notes[key] = document.getElementById('summaryInput').value.trim(); persist(); document.getElementById('summaryStatus').textContent = '已保存'; renderRecentEntries(); });
      };
      const render = () => { updateHeader(); renderRecentEntries(); if (searchTerm.trim()) renderSearchResults(); else if (view === 'day') renderDay(); else if (view === 'week') renderWeek(); else if (view === 'month') renderMonth(); else renderCalendar(); };
      const addEntry = () => {
        const titleField = document.getElementById('entryTitle');
        const contentField = document.getElementById('entryText');
        const title = titleField.value.trim();
        const content = contentField.value.trim();
        if (!title) { titleField.focus(); showToast('先写下这件事的标题'); return; }
        const hours = Number(document.getElementById('entryDurationHours').value || 0);
        const remainder = Number(document.getElementById('entryDurationMinutes').value || 0);
        if (!Number.isInteger(hours) || hours < 0 || hours > 24 || !Number.isInteger(remainder) || remainder < 0 || remainder > 59 || hours * 60 + remainder > 1440) {
          showToast('时长请填写 0 至 24 小时、0 至 59 分钟');
          return;
        }
        const duration = hours * 60 + remainder;
        const tag = document.getElementById('entryTag').value;
        if (editingEntryId) {
          const entry = state.entries.find((item) => item.id === editingEntryId);
          if (!entry || entry.date !== dateKey(selectedDate)) { editingEntryId = ''; showToast('这条记录已不存在'); render(); return; }
          Object.assign(entry, { title, detail: content, tag, duration });
          editingEntryId = '';
          persist(); activeTag = '全部'; render(); showToast('记录修改已保存');
          return;
        }
        const now = new Date();
        state.entries.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), date: dateKey(selectedDate), time: dateKey(selectedDate) === dateKey(today) ? `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` : '全天', title, detail: content, tag, project: '', duration });
        persist(); activeTag = '全部'; render(); showToast('记录已保存到这台设备');
      };
      const deleteEntry = (id) => { state.entries = state.entries.filter((entry) => entry.id !== id); if (editingEntryId === id) editingEntryId = ''; persist(); render(); showToast('记录已删除'); };
      const setView = (nextView) => { view = nextView; if (nextView !== 'day') editingEntryId = ''; activeTag = '全部'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => setView(button.dataset.view)));
      document.addEventListener('click', (event) => {
        const entryButton = event.target.closest('[data-open-entry]');
        if (entryButton) {
          const entry = state.entries.find((item) => item.id === entryButton.dataset.openEntry);
          if (entry) openDay(entry.date, entry.id);
          return;
        }
        const dateButton = event.target.closest('[data-open-date]');
        if (dateButton) openDay(dateButton.dataset.openDate);
        const categoryButton = event.target.closest('[data-action="manage-categories"]');
        if (categoryButton) openCategoryManager();
      });
      document.getElementById('addCategoryButton').addEventListener('click', addCategory);
      document.getElementById('newCategoryInput').addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); addCategory(); } });
      document.getElementById('closeCategoryDialog').addEventListener('click', () => document.getElementById('categoryDialog').close());
      document.getElementById('categoryDialog').addEventListener('click', (event) => { if (event.target === event.currentTarget) event.currentTarget.close(); });
      document.getElementById('newEntry').addEventListener('click', () => { setView('day'); setTimeout(() => document.getElementById('entryTitle')?.focus(), 50); });
      document.getElementById('jumpToday').addEventListener('click', () => { selectedDate = new Date(today); setView('calendar'); });
      document.getElementById('backToCalendar').addEventListener('click', () => setView('calendar'));
      document.getElementById('todayButton').addEventListener('click', () => { editingEntryId = ''; selectedDate = new Date(today); render(); });
      document.getElementById('previousDate').addEventListener('click', () => { editingEntryId = ''; selectedDate = view === 'day' ? shiftDate(selectedDate, -1) : view === 'week' ? shiftDate(selectedDate, -7) : new Date(selectedDate.getFullYear(), selectedDate.getMonth() - 1, 1); render(); });
      document.getElementById('nextDate').addEventListener('click', () => { editingEntryId = ''; selectedDate = view === 'day' ? shiftDate(selectedDate, 1) : view === 'week' ? shiftDate(selectedDate, 7) : new Date(selectedDate.getFullYear(), selectedDate.getMonth() + 1, 1); render(); });
      document.getElementById('searchInput').addEventListener('input', (event) => { searchTerm = event.target.value; render(); });
      document.getElementById('exportButton').addEventListener('click', () => {
        const content = ['# 拾日记录', '', ...state.entries.slice().sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time)).map((entry) => `## ${entry.date} ${entry.time}\n\n${entry.title}${entry.detail ? `\n\n${entry.detail}` : ''}\n\n分类：${entry.tag}${entry.project ? ` · ${entry.project}` : ''}${entry.duration ? ` · ${formatDuration(entry.duration)}` : ''}\n`)].join('\n');
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = '拾日记录.md'; link.click(); URL.revokeObjectURL(url); showToast('记录已导出为 Markdown');
      });
      render();
    })();
  </script>
</body>
</html>
